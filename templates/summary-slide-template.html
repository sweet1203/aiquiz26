<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} 쉬운 설명 슬라이드</title>
  <style>
    :root { --bg:#f4efe6; --paper:#fffaf1; --ink:#202124; --line:#dfd1bb; --green:#1f7a5a; --blue:#2c66b8; --navy:#233042; --shadow:0 22px 60px rgba(75,56,31,.16); }
    * { box-sizing:border-box; }
    html, body { margin:0; overflow:hidden; }
    body { background:linear-gradient(180deg,#fbf6ec,var(--bg)); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif; line-height:1.65; word-break:keep-all; }
    body.presenter-ready .slide { display:none; }
    body.presenter-ready .slide.active { display:grid; }
    .deck-nav { display:flex; gap:8px; align-items:center; overflow-x:auto; padding:10px max(18px,calc((100vw - 1180px)/2)); background:rgba(255,250,241,.88); border-bottom:1px solid rgba(35,48,66,.12); }
    .deck-nav a { flex:0 0 auto; padding:8px 12px; border:1px solid rgba(35,48,66,.12); border-radius:999px; background:rgba(255,255,255,.72); color:var(--navy); font-size:.92rem; font-weight:800; text-decoration:none; }
    .deck-nav a.active { background:var(--navy); color:#fff7e8; border-color:var(--navy); }
    .slide { width:min(1180px,calc(100% - 32px)); height:calc(100vh - 58px); margin:0 auto; padding:28px 0; display:grid; align-items:center; }
    .slide-card { position:relative; overflow:auto; max-height:100%; padding:clamp(28px,4vw,54px); border:1px solid var(--line); border-radius:34px; background:rgba(255,250,241,.94); box-shadow:var(--shadow); }
    .eyebrow { margin:0 0 10px; color:var(--green); font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    h1, h2, p { margin-top:0; } h1 { max-width:880px; font-size:clamp(2.6rem,6vw,5.5rem); line-height:1.04; letter-spacing:-.065em; } h2 { font-size:clamp(2rem,4.4vw,4rem); line-height:1.1; letter-spacing:-.055em; }
    .lead { max-width:820px; font-size:clamp(1.12rem,2.2vw,1.45rem); } .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:24px; }
    .tile, .quiz-card { padding:22px; border:1px solid rgba(35,48,66,.12); border-radius:22px; background:#fff; } .tile strong { display:block; margin-bottom:6px; color:var(--blue); }
    .big-line { margin-top:24px; padding:22px 26px; border-left:8px solid var(--green); border-radius:22px; background:#edf8f1; font-size:clamp(1.15rem,2.1vw,1.55rem); font-weight:850; }
    details { margin-top:14px; border-radius:16px; background:#edf8f1; border:1px solid rgba(31,122,90,.25); } summary { cursor:pointer; padding:12px 14px; color:var(--green); font-weight:900; } details p { margin:0; padding:0 14px 14px; }
    @media (max-width:900px) { .deck-nav { position:static; flex-wrap:wrap; overflow-x:visible; padding:10px 16px; } .slide { height:calc(100vh - 101px); padding:14px 0 18px; } .grid { grid-template-columns:1fr; } }
    @media print { html, body { overflow:visible; background:#fff; } body.presenter-ready .slide { display:grid; } .deck-nav { display:none; } .slide { height:auto; width:100%; break-after:page; } .slide-card { max-height:none; overflow:visible; box-shadow:none; } }
  </style>
</head>
<body class="presenter-ready">
  <nav class="deck-nav" aria-label="슬라이드 바로가기">
    <a href="#slide-1">시작</a>
    <a href="#slide-2">핵심</a>
    <a href="#slide-3">문제</a>
  </nav>
  <main>
    <section class="slide active" id="slide-1" aria-labelledby="title"><div class="slide-card"><p class="eyebrow">{{UNIT}} · 쉬운 설명 정리본</p><h1 id="title">{{TITLE}}</h1><p class="lead">{{SUMMARY}}</p></div></section>
    <section class="slide" id="slide-2" aria-labelledby="concept"><div class="slide-card"><h2 id="concept">핵심 개념</h2><div class="grid">{{CONCEPT_TILES}}</div><div class="big-line">{{KEY_SENTENCE}}</div></div></section>
    <section class="slide" id="slide-3" aria-labelledby="quiz"><div class="slide-card"><h2 id="quiz">객관식 확인 문제</h2><div class="quiz-card"><p>{{QUIZ_PROMPT}}</p><details><summary>답 확인</summary><p>{{QUIZ_ANSWER}}</p></details></div></div></section>
  </main>
  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    const navLinks = Array.from(document.querySelectorAll('.deck-nav a'));
    function showSlide(index) {
      const safeIndex = Math.max(0, Math.min(index, slides.length - 1));
      slides.forEach((slide, slideIndex) => slide.classList.toggle('active', slideIndex === safeIndex));
      navLinks.forEach((link, linkIndex) => link.classList.toggle('active', linkIndex === safeIndex));
      history.replaceState(null, '', `#${slides[safeIndex].id}`);
    }
    navLinks.forEach((link, index) => link.addEventListener('click', (event) => { event.preventDefault(); showSlide(index); }));
    document.addEventListener('keydown', (event) => { const current = slides.findIndex((slide) => slide.classList.contains('active')); if (['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)) { event.preventDefault(); showSlide(current + 1); } if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) { event.preventDefault(); showSlide(current - 1); } });
  </script>
</body>
</html>
